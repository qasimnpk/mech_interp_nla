[project]
name = "mech-interp"
version = "0.1.0"
description = "Local mech-interp environment for the natural-language-autoencoder (NLA) project: Qwen on MPS via HF transformers + raw forward hooks."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "transformers==5.16.1",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "scikit-learn",
    "numpy",
    "pandas",
    "matplotlib",
    "ipython",
    "ipykernel",
    "datasets",
    "einops",
    "tqdm",
    "circuitsvis>=1.43.3",
    "lovely-tensors>=0.1.22",
    "plotly>=7.0.0",
    "nbformat>=4.2.0",
    "seaborn>=0.13.2",
    "torchinfo>=1.8.0",
    "ipywidgets>=8.1.9",
]

[tool.uv]
package = false
